# 音乐收集插件配置
# 首次运行会自动复制到 data/config.yaml，之后改这份副本或用群命令修改

enabled: true

# 手动覆盖收集状态（方便测试，不改动时间表）：
#   auto = 按时间窗口自动判断（默认）
#   on   = 强制正在收集（无视时间窗口）
#   off  = 强制停止收集（无视时间窗口）
collect_override: auto

# 生效群号，留空表示所有群
groups: []

# 识别到音乐后是否回发音乐卡片（@+文字提示始终发送，本项只控制卡片）
reply_card: true

# 同一首歌被重复分享时是否提示
notify_duplicate: true

# 汇总结果额外发送到哪些群，留空则发回收集所在群
report_groups: []

window:
  # weekly 每周循环 / daily 每日循环 / once 单次区间
  mode: weekly
  timezone: Asia/Shanghai
  # 归档时刻是否等于结束收集时刻：
  #   true  = 收工那一刻顺手建歌单（只跑一个定时任务）
  #   false = 先到 end 结束收集并播报，再到 archive 单独建歌单
  archive_same_as_end: true

  # 每周模式：星期缩写 MON/TUE/WED/THU/FRI/SAT/SUN，也支持"周一"
  weekly:
    start: MON 00:00      # 开始收集
    summary: SUN 22:00    # 汇总播报（文字列表 + 长图）
    end: SUN 22:30        # 结束收集：此后不再收录新歌
    archive: SUN 22:30    # 归档：建网易云歌单

  # 每日模式
  daily:
    start: '00:00'
    summary: '23:00'
    end: '23:30'          # 结束收集
    archive: '23:30'

  # 单次模式
  once:
    start: 2026-08-10 00:00
    summary: 2026-08-20 22:00
    end: 2026-08-20 22:30        # 结束收集
    archive: 2026-08-20 22:30

playlist:
  # 可用占位符：{window} {group} {count} {date} {seq} {slash} {yy}{m}{d}
  name_template: 群歌单 {window}
  description_template: 由 QQ 群 {group} 在 {window} 期间收集，共 {count} 首。
  # 简介里附上「谁分享了什么歌」清单（true/false）
  include_sharers: true
  # 清单样式：list=逐首列（含分享者）/ by_person=按人聚合 / by_name=只列分享者名 / none=不附
  sharer_style: list
  # 自增期号，每成功归档一次 +1（用于 Wk.86 这种编号）
  seq: 1
  seq_auto_increment: true
  # 一次性歌单名：设置后下一次归档用它，用完自动清空。
  # 若该窗口之前已建过歌单（复用场景），会把已有歌单真的改名成这个名字。
  pending_name: ''
  privacy: false
  # 非网易云来源的歌曲，是否在网易云搜索匹配后加入
  cross_platform_match: true
  # 严格匹配：歌名与歌手都要对得上；关闭后命中率更高但可能加错版本
  strict_match: true
  batch_size: 100
  # 简介写入失败时的重试次数（网易云对改简介有频控，失败会自动入队补写）
  desc_retry: 3
  # 定时补写待写入简介的间隔分钟数；<=0 关闭自动补写
  desc_retry_minutes: 30
  # 昵称 / 歌名里的表情处理：text=转中文词[音符]  strip=直接删  keep=原样
  # 网易云简介是 utf8(3字节) 存储，emoji 是 4 字节，keep 有很大概率写不进去
  emoji_style: text
  # 简介清单里是否带歌手名
  desc_show_artist: true
  # 简介清单条目之间是否插空行（by_person 样式下按人分段）
  desc_blank_line: false
  # 分享者昵称映射：仅做展示层替换，入库仍保留原始昵称。
  # key 可以是「昵称」也可以是「QQ 号码」（昵称优先于 QQ 匹配）。
  # 例：{菜老名: Jacksing, 123456789: Jacksing}
  # 设置后网易云简介 / 群内文字榜单 / WebUI 表格里的「菜老名」都会显示成「Jacksing」
  sharer_aliases: {}
  # 分享即归档：每收到一批新歌分享，立即把新歌追加进当前窗口的歌单
  #（自动复用已建歌单，不新建、不消耗期号）。默认关闭；开启后静默执行，结果只记日志
  auto_archive_on_share: false
  # 同一窗口内**同一用户只收录第一首**：该用户本期首次分享即占位，之后再分享的歌
  # 不入榜（也不进总库），只回一条提示（文案见 reply.sharer_limit_text）。
  # 判定基准是「首次分享」而非「首次成功收录」——首发那首即使因重复 / 无法匹配没进榜，
  # 名额同样算用掉，避免同一个人反复试探多占坑。
  one_per_sharer: true
  # 非网易云歌曲在**分享时**立即探测能否匹配到网易云；匹配不到就把提示附在收录消息里
  #（文案见 reply.unmatched_text），让分享者当场知道不会进本期歌单，而不是等归档报告。
  # 关闭后省掉这次预搜索（归档阶段仍会正常匹配）。
  notify_unmatched: true
  # 引用回填匹配：在群里**引用**机器人那条「没法匹配」的提示消息、并贴上正确的
  # 网易云歌曲链接，即把这首歌绑定到该链接（管理员或该歌分享者才可操作）。
  # 只对**尚未匹配**的歌生效；已匹配过的会回一句提示、不会被覆盖。
  # 命中后立刻把歌补进本期歌单（当前窗口仍在收集期时）。文案见 reply.match_*_text。
  reply_match: true

# ---------------------------------------------------------------------------
# 网易云登录态维护：掉登录后自动重新登录。
# 背景：MUSIC_U cookie 会过期或被风控，失效后写歌单简介/建歌单统一返回
#       code=301「需要登录」，表现为「简介一直写不上去」。
# 开启后：写简介失败且判定为登录态失效时，会先尝试 cookie 续期，不行再用
#       手机号 + 密码重新登录，然后自动重试一次，无需人工重新粘贴 cookie。
# ⚠️ 这里保存的是账号凭证，请确保 data/config.yaml 只有自己可读
#    （Linux: chmod 600 data/config.yaml）。
# ---------------------------------------------------------------------------
netease:
  # 总开关：关闭后完全保持旧行为（失败只记录日志、入队等定时补写）
  auto_relogin: true
  # 登录手机号；留空则只做 cookie 续期，不做账密重登
  phone: ''
  # 登录密码（明文，仅保存在本机配置文件）；也可以只填下面的 password_md5
  password: ''
  # 密码的 md5（32 位十六进制，小写）；填了它就不用填上面的 password
  password_md5: ''
  # 手机号国家码
  countrycode: '86'
  # 两次自动重登尝试的最小间隔（秒），避免风控期疯狂重试
  relogin_cooldown: 300

# ---------------------------------------------------------------------------
# 总库：跨窗口去重的群级歌曲库。
# 开启后每首新分享会同时进入总库（与正常收集互相独立）；分享已存在于总库的歌会
# 提示重复（仅跨窗口；同窗口重复仍走通用设置的「重复提醒」）。总库可像正常收集
# 一样在网页端增删改、拖拽排序、同步到歌单，并独立归档成一个大歌单。
# 归档相关字段与上面 playlist 段互相独立、可分别设置。
# ---------------------------------------------------------------------------
master:
  # 总库总开关：关闭后分享不会写入总库，也不会做总库查重提示
  enabled: false
  # 分享时是否与总库对比，命中已存在则提示重复
  compare_on_share: true
  # 重复提示文案，用 \n 表示换行。可用占位符：
  #   {title}歌名 {artists}歌手 {platform}来源 {sharer}本次分享者
  #   {who}总库首发者 {index}总库序号 {count}总库总数 {window}当前窗口
  #   {period}首发所在期号（来源窗口） {date}首发分享日期(YY/MM/DD)
  notify_template: " 这首《{title}》在 {date} 已经有人分享过了（总库第 {index} 位，首发: {who}）"
  # 分享即归档：每收到新分享立即把总库增量同步到总库歌单（静默执行，不刷屏）
  auto_archive: false
  # 总库归档用歌单配置（与上面 playlist 段互相独立，可分别设置）
  name_template: 群总库 {group}
  description_template: 由 QQ 群 {group} 跨窗口汇总收集，共 {count} 首。
  include_sharers: true
  sharer_style: list
  seq: 1
  seq_auto_increment: true
  pending_name: ''
  privacy: false
  cross_platform_match: true
  strict_match: true
  batch_size: 100
  desc_retry: 3
  desc_retry_minutes: 30
  emoji_style: text
  desc_show_artist: true
  desc_blank_line: false
  sharer_aliases: {}

# 已收集歌曲的清理（区别于 cache：cache 清理的是榜单图片缓存）
clear:
  # 归档（结束收集）建歌单成功后，是否自动清空本期已收集歌曲
  after_archive: false
  # 定时清理总开关
  scheduled_enabled: false
  # 保留天数；早于 now-keep_days 的收集记录会被删除；<=0 表示不按时间清
  keep_days: 30
  # 每天执行定时清理的时刻
  prune_at: '05:00'

# 音乐卡片发送策略
# 背景：协议端（NapCat / go-cqhttp）发「原生」音乐卡片时要向外部签名服务换取
# ArkShare 结构，那个服务经常 500 或超时，日志会刷：
#   [音乐卡片签名失败] Unexpected status code: 500
#   Error: 消息体无法解析, 请检查是否发送了不支持的消息类型
# 遇到这种情况把 mode 改成 custom 即可（自定义卡片不经过签名服务）。
card:
  # native = 平台原生卡片（最好看，依赖签名服务）
  # custom = 自定义卡片（自己拼标题/封面/跳转链接，不走签名服务，最稳）
  # off    = 不发卡片，只发文字 + 封面
  mode: native
  # 原生卡片失败后自动再试一次自定义卡片
  fallback_custom: true
  # 卡片都失败时补发一条文字（歌名 / 歌手 / 可点击链接）
  fallback_text: true
  # 文字兜底里附上封面图
  fallback_cover: true
  # 同一平台连续失败几次后熔断，冷却期内直接走文字不再空等；0 = 不熔断
  failure_threshold: 3
  # 熔断冷却分钟数，到点自动恢复试探
  cooldown_minutes: 10

render:
  max_items_per_image: 40
  show_cover: true
  # 留空自动探测系统中文字体
  font_path: null
  # 泰文字体路径。歌单图片里的泰文昵称/歌名需要；主字体(CJK)不含泰文，不装会显示成方块。
  # 留空则自动探测系统中的泰文字体（如 fonts-noto-sans-thai / google-noto-sans-thai-fonts）。
  thai_font_path: null
  # light / dark
  theme: dark

# 收录回复：识别到新歌并入库后回发的那条消息
reply:
  # 是否启用自定义模板；关闭时用内置格式（等同于下面的默认模板）
  enabled: false
  # 可用占位符：
  #   {index} 本期序号    {nick} 分享者（已套昵称映射）
  #   {title} 歌名        {artists} 歌手       {album} 专辑
  #   {platform} 来源平台 {url} 链接           {duration} 时长
  #   {artists_line} 整行「歌手: xxx」，无歌手时整行消失
  #   {album_line}   整行「专辑: xxx」，无专辑时整行消失
  #   {unmatched_line} 整行「网易云搜不到」提示，能匹配到网易云时整行消失
  #                   （文案取自下面的 unmatched_text）
  #   {song}     歌曲详情块（歌名 + 歌手 / 专辑 / 来源 / 时长）
  #   {playlist} 当前群当前窗口的网易云歌单（名称 + 链接），
  #              本期还没归档时用下面的 playlist_empty_text 代替
  #   {count} 本期已收录首数   {window} 窗口文案
  accept_text: |-
    已收录 · 本期第 {index} 首
    {title}
    {artists_line}{album_line}来源: {platform}
    {unmatched_line}
  # {playlist} 在本期尚未归档时的替代文案
  playlist_empty_text: （本期歌单还没生成）
  # 歌曲在网易云搜不到时，附在**收录消息同一条**里的提示（不额外刷屏）。
  # 只在 playlist.notify_unmatched 打开、且确实搜不到时出现。
  # 占位符：{title} 歌名 {artists} 歌手 {platform} 来源平台
  #         {nick} 分享者 {index} 本期序号 {count} 本期已收录数 {window} 窗口文案
  unmatched_text: '⚠️ 这首在网易云没搜到，不会进本期歌单（可找管理员手动匹配）'
  # 同一用户本期重复分享时的提示文案（见 playlist.one_per_sharer）。
  # 占位符：{nick} 本次分享者（已套昵称映射）
  #         {title} 其本期**首发**的歌名   {artists} 首发歌歌手
  #         {platform} 首发歌来源平台      {index} 首发歌本期序号（首发没进榜时为 —）
  #         {count} 本期已收录首数         {window} 窗口文案
  sharer_limit_text: ' 本期你已经分享过《{title}》了，要更换的话请找管理员'
  # 「引用提示消息 + 网易云链接」回填匹配成功后的回执（见 playlist.reply_match）。
  # 占位符：{title} 原歌名 {artists} 原歌手
  #         {matched_title} 匹配到的歌名 {matched_artists} 匹配到的歌手
  #         {nick} 操作者 {window} 窗口文案
  match_ok_text: '✅ 已把《{title}》匹配为「{matched_title} - {matched_artists}」，稍后会补进本期歌单'
  # 回填匹配失败时的回执（链接解析不出 / 拉不到详情 / 歌已匹配过）。
  # 占位符：{title} 原歌名 {reason} 失败原因
  match_fail_text: '❌ 没能匹配上《{title}》：{reason}'
  # 非管理员、也非该歌分享者却引用指定匹配时的提示。占位符：{title} {nick}
  match_deny_text: '只有管理员或这首歌的分享者能指定匹配哦'

# 被 @ 时的自我介绍（/music intro 可改；\n 在命令行里表示换行）
intro:
  enabled: true
  text: |-
    你好 {nick}，我是群音乐收集助手 🎵
    把网易云 / QQ音乐 / 酷狗 / 酷我 的歌曲分享到群里，我会自动收录并排序。
    本期：{window}（{state}），已收集 {count} 首。
    发送 /music help 查看全部命令。
  cooldown: 10          # 同一群冷却秒数，0=不限频
  at_sender: true       # 回复时是否 @ 提问者
  skip_commands: true   # 消息带 /music 命令时不发自我介绍
  skip_music: true      # 消息带音乐分享时不发自我介绍（那是分享不是提问）
  always_reply: true    # 收集关闭 / 不在收集期时，是否仍然回应自我介绍

# 运行日志（网页端「日志」页的数据源）
# 说明：NoneBot 把日志打到 stdout，服务端由 systemd 收进 journald，进程里读不到；
# 所以这里在内存里留一份定长环形缓冲给网页端看。只含**本次进程启动后**的日志。
logs:
  # 内存里保留的条数（50 ~ 200000），满了丢最旧的。约 1000 条 ≈ 200KB 内存
  lines: 2000
  # 记录的最低等级：TRACE / DEBUG / INFO / SUCCESS / WARNING / ERROR / CRITICAL
  # 页面上的级别筛选是在**已记录**的范围内过滤，想看 DEBUG 得先把这里调低
  level: INFO
  # 额外落盘一份（相对路径基于项目根目录），按 5MB 轮转、保留最近 3 份，可跨重启留存
  # 留空 = 不写文件（服务器上如果想长期留档，可以填 data/logs/bot.log）
  file: ''
  # 记录「收到 / 发出的群消息」摘要（含普通聊天，不只音乐分享）。
  # 想在日志页看到「谁在什么时候发了什么、机器人回了什么」就保持 true；
  # 嫌吵可以关掉——开关收集、改设置、归档结果等事件日志不受影响。
  trace_messages: true

# 机器人设置：被 @ 时用大模型回复（OpenAI 兼容接口）
# ⚠️ 这一段**只能在网页端「机器人」页修改**，群内没有任何命令能读写它。
# 触发条件：@机器人 且消息既不是 /music 命令、也不是音乐分享。
llm:
  enabled: false              # 总开关；关闭时 @ 仍走下面的 intro 自我介绍
  groups: []                  # 生效群号，留空 = 所有群
  base_url: https://api.openai.com/v1   # 填到 /v1 为止即可，程序自动补 /chat/completions
  api_key: ''                 # 各家平台的 Key（日志里会打码）
  model: gpt-4o-mini          # 如 deepseek-chat / qwen-plus / llama3.1
  system_prompt: |-
    你是 QQ 群里的音乐收集助手，性格随和、说话简洁，用中文回答。
    群友分享歌曲由另一套功能处理，你只负责聊天答疑；不确定的事不要编。
  temperature: 0.7            # 0 最稳、2 最飘（推理模型与「思考模式」下会被上游忽略）
  top_p: 1.0                  # 核采样，1.0 = 不启用；一般只调温度或只调 top_p
  presence_penalty: 0.0       # 话题新鲜度 -2~2，0 = 不干预（思考模式下不生效）
  frequency_penalty: 0.0      # 词频惩罚 -2~2，0 = 不干预（思考模式下不生效）
  max_tokens: 512             # 单次生成上限（思考 token 也算在里面，开思考要调大）
  stop: []                    # 停止词，逗号分隔；一般留空
  seed: -1                    # -1 = 不发送（每次随机）；填固定值可复现回复
  # ---- 思考模式 ----
  thinking: auto              # auto=不干预 / off=尽量关 / low / medium / high / max（仅部分厂商）
  thinking_style: auto        # auto / reasoning_effort / enable_thinking / thinking_object / deepseek / none
                              # 走中转或本机地址时 auto 认不出厂商，DeepSeek 请显式写 deepseek
  thinking_budget: 0          # 0 = 按档位默认（低 1024 / 中 4096 / 高 12000）；DeepSeek 不收预算，忽略此项
  extra_body: ''              # 原样合并进请求体的 JSON，如 {"top_k": 20}，覆盖上面同名项
  timeout: 30.0               # 请求超时秒数（上下文很大时要相应调大）
  history_rounds: 3           # 携带最近几轮对话（1 轮=1问+1答），0=不带，最多 20000
  history_chars: 3000         # 真正决定带多少历史的旋钮：总字符上限，超出丢最旧的成对
                              # 实测 deepseek 中文约 2 字/token，窗口 1M token≈200 万汉字；
                              # 想「一直记得」就调到 1200000~1400000（约 60~70 万 token），
                              # 剩下留给系统提示词、群记忆和当前这一问
  history_item_chars: 2000    # 单条历史最多保留多少字（原来硬编码 600，会把长回复腰斩）
  history_days: 180           # 从库里恢复多少天内的对话（0=永久）；重启后靠它接上话
  cooldown: 3                 # 同一用户同群的冷却秒数，0=不限
  read_reply: true            # 读取被引用消息的内容（引用一条+提问时模型才知道在问什么）
  reply_chars: 200            # 被引用内容最多取多少字，0=不限
  vision: false               # 把图片发给模型（需要视觉模型如 qwen-vl/glm-4v/gpt-4o）
  max_images: 2               # 一次最多带几张图，多的只留 [图片] 标记
  # ---- 聊天记录（模型原生看不到，要我们先展开）----
  read_forward: true          # 展开「转发的聊天记录」给模型看
  forward_limit: 30           # 一次最多展开几条转发消息
  forward_chars: 2000         # 转发内容总字数上限，超出标出还剩几条
  # ---- 工具与技能（模型自己能调的能力）----
  tools: true                 # 工具总闸；关掉后模型只能纯聊天
  tool_rounds: 3              # 一次回复最多调几轮工具；0=不许调
  tool_chars: 2000            # 单次工具结果最多回填多少字
  web_tool: true              # 提供 fetch_url（模型需要时自己抓网页正文）
  fetch_chars: 2000           # fetch_url 返回的正文最多多少字
  fetch_timeout: 15.0         # fetch_url 超时秒数
  skills: true                # 启用技能包（扫 data/skills/*/SKILL.md）
  skills_dir: ''              # 技能目录，留空=data/skills；相对路径按 data/ 解析
  skill_body_chars: 3000      # use_skill 返回的技能正文上限
  skill_scripts: false        # 允许执行技能自带脚本（危险，默认关）
  skill_timeout: 20.0         # 技能脚本超时秒数，超时直接 kill
  max_input_chars: 500        # 单条提问最多取多少字，0=不限
  max_reply_chars: 800        # 回复最多发多少字，0=不限（超长自动分条）
  at_sender: true             # 回复时 @ 提问者
  fallback_intro: true        # 调用失败时退回内置自我介绍（关掉则静默）
  # ---- 附加触发（除了 @机器人，还有两种该接话的场合）----
  poke_reply: true            # 群友戳一戳机器人时让模型回一句
  poke_prompt: '（戳了戳你）'  # 被戳时送给模型的那句话
  reply_link: false           # 非音乐链接是否**不@也主动**接话。默认关，避免在群里抢话；
                              # @ 机器人再发链接照常回答；真音乐链接任何时候都不受影响
  link_hint: '（这不是音乐平台的歌曲链接，顺口接一句就行，不用当成点歌）'

# ---------------------------------------------------------------- 群记忆
# 机器人旁听群聊（只记录、不回复），每隔一段时间把「谁是什么样的」整理成
# 每人一份 markdown，聊天时自动带上。重启、换模型都不会丢。
# 档案位置：data/memory/<群号>/people/<QQ号>.md —— 可以直接用编辑器改。
memory:
  enabled: true               # 总开关；关掉后不旁听、不注入、也不给模型记忆工具
  dir: ''                     # 记忆目录，留空=data/memory；相对路径按 data/ 解析
  inject_chars: 60000         # 每次请求最多带多少字档案（按最近活跃取人）
  note_chars: 8000            # 单人档案上限，到顶后新记录会挤掉最早的条目
  listen: true                # 旁听群消息（这是「记得住每个人」的前提）
  listen_groups: []           # 旁听哪些群，留空 = 跟 llm.groups 一致
  digest_hours: 6.0           # 多久自动整理一次；0 = 只能手动点「立即整理」
  digest_msgs: 300            # 一次最多看多少条新消息
  digest_chars: 20000         # 喂给整理任务的聊天记录字数上限
  digest_model: ''            # 整理用哪个模型，留空 = 跟主模型一致
  digest_max_tokens: 4000     # 整理输出上限（要输出 JSON，别太小）
  keep_days: 180              # 群聊记录保留天数（上下文与整理素材共用），0=永久
